<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>坡下小世界</title>
<style>
  :root{--ui:#262624ee;--ink:#f3f1ea;--dim:#a6a498;--gold:#d97757}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#0a0c12;
    font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--ink);
    -webkit-user-select:none;user-select:none}
  canvas{position:fixed;inset:0;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
  .panel{position:fixed;background:#262624f0;border:1px solid #3d3d3a;border-radius:12px;
    padding:6px 10px;box-shadow:0 6px 20px -8px #000a;font-size:11px}
  .slot .ic img{width:26px;height:26px;image-rendering:pixelated;display:block;margin:0 auto}
  .slot.on{box-shadow:0 0 0 1px #d9775766}
  #hearts span{font-size:14px}
  #hud{left:10px;top:10px;display:flex;gap:12px;align-items:center}
  #hud b{color:var(--gold)}
  #hearts{letter-spacing:2px;font-size:13px}
  #bar{left:50%;bottom:10px;transform:translateX(-50%);display:flex;gap:5px;padding:5px}
  .slot{width:46px;padding:4px 0 3px;text-align:center;cursor:pointer;border:1px solid transparent;border-radius:3px;color:var(--dim);position:relative}
  .slot .ic{line-height:1}
  .slot .nm{font-size:8px;margin-top:1px}
  .slot .kn{position:absolute;top:1px;left:3px;font-size:8px;opacity:.6}
  .slot.on{border-color:var(--gold);color:var(--ink);background:#00000055}
  .slot .ct{font-size:8px;opacity:.75}
  #toast{position:fixed;left:50%;bottom:66px;transform:translateX(-50%);background:#000000bb;
    padding:4px 12px;border-radius:3px;font-size:11px;opacity:0;transition:opacity .2s;pointer-events:none}
  #hint{right:10px;top:10px;font-size:9px;color:var(--dim);text-align:right;line-height:1.8}
  #hint b{color:var(--ink)}
  .crow{display:flex;justify-content:space-between;align-items:center;padding:5px 6px;border-radius:3px;cursor:pointer;font-size:10px}
  .crow:hover{background:#00000044}
  .crow.no{opacity:.45;cursor:default}
  .crow .need{color:var(--dim);font-size:9px}
  @media(max-width:640px){#hint{display:none}.slot{width:38px}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="panel" id="hud"><span id="hearts"></span><span>◈ <b id="c">20</b></span><span id="dt">☀ 1</span></div>
<div class="panel" id="bossbar" style="display:none;left:50%;top:8px;transform:translateX(-50%);min-width:240px;text-align:center">史莱姆王 <div style="height:8px;background:#00000055;border-radius:4px;margin-top:4px;overflow:hidden"><div id="bossfill" style="height:100%;width:100%;background:linear-gradient(90deg,#6a8ae0,#8aaaf0);border-radius:4px"></div></div></div>
<div class="panel" id="hint">
  <b>A/D</b> 走 · <b>W/空格</b> 跳 · <b>左键</b> 挖/打<br>
  <b>右键</b> 放置/种 · <b>1-9 0 - =</b> 选物 · 滚轮缩放<br>
  石头用镐 · 工作台合成工具/护甲 · 夜里小心僵尸<br>
  👑 王冠召唤史莱姆王 · 💎 深处藏着宝石矿
</div>
<div class="panel" id="bar"></div>
<div class="panel" id="craft" style="display:none;left:50%;top:50%;transform:translate(-50%,-50%);min-width:230px;max-height:70vh;overflow:auto">
  <div style="display:flex;justify-content:space-between;margin-bottom:6px">
    <b style="color:var(--gold)">合成 / 冶炼</b><span style="color:var(--dim);cursor:pointer" id="craftX">✕</span>
  </div>
  <div id="craftList"></div>
  <div style="margin-top:6px;font-size:9px;color:var(--dim)">煤 <span id="mcoal">0</span> · 铁 <span id="miron">0</span> · 金 <span id="mgold">0</span> · 凝胶 <span id="mgel">0</span> · 宝石 <span id="mgem">0</span></div>
</div>
<div id="toast"></div>
<script>
"use strict";
window.onerror=function(m,s,l,c){document.title='ERR:'+m+'@'+l+':'+c;return false;};
/* ================= 基础 ================= */
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let W,H,DPR;
function rs(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;cv.style.width=W+'px';cv.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.imageSmoothingEnabled=false;}
addEventListener('resize',rs);rs();

const T=16, WW=140, WH=44;
const AIR=0,GRASS=1,DIRT=2,STONE=3,WOOD=4,LEAF=5,SAND=6,PLANK=7,TORCH=8,COAL=9,IRON=10,GOLD=11,FLOWER=12,GRASS2=13;
const BED=14,BENCH=15,FURNACE=16,GLASS=17,BRICK=18,WATER=19;
const VINE=20,MUSH=21,CACTUS=22,SHROOM=23,TALLGRASS=24;
const BUSH=25,FERN=26,SAPLING=27,BERRY=28;
const LAVA=29;
const GEM=30;
const KM='1234567890-=';
const NM={[BED]:'床',[BENCH]:'工作台',[FURNACE]:'熔炉',[GLASS]:'玻璃',[BRICK]:'砖块'};
const h2=(x,y)=>(((x*73856093)^(y*19349663))>>>0);

/* ================= 纹理 ================= */
function mkTex(fn){
  const out=[];
  for(let v=0;v<3;v++){
    const c=document.createElement('canvas');c.width=c.height=16;
    const g=c.getContext('2d');let s=v*97+13;
    const rnd=()=>{s=(s*16807)%2147483647;return s/2147483647;};
    fn(g,rnd);out.push(c);
  }
  return out;
}
const TEX={};
TEX[DIRT]=mkTex((g,r)=>{
  g.fillStyle='#7a5a3a';g.fillRect(0,0,16,16);
  for(let i=0;i<14;i++){g.fillStyle=r()<.5?'#6a4c30':'#8a6a44';g.fillRect(r()*16|0,r()*16|0,2,1);}
});
TEX[GRASS]=mkTex((g,r)=>{
  g.fillStyle='#7a5a3a';g.fillRect(0,0,16,16);
  for(let i=0;i<10;i++){g.fillStyle='#6a4c30';g.fillRect(r()*16|0,4+r()*12|0,2,1);}
  g.fillStyle='#5c9a44';g.fillRect(0,0,16,5);
  g.fillStyle='#6cab52';for(let x=0;x<16;x+=2)g.fillRect(x,0,1,3);
  g.fillStyle='#4a7d36';for(let x=0;x<16;x+=3){const d=4+(r()*3|0);g.fillRect(x,4,1,d);}
});
TEX[STONE]=mkTex((g,r)=>{
  g.fillStyle='#8a8a92';g.fillRect(0,0,16,16);
  for(let i=0;i<8;i++){g.fillStyle='#76767e';g.fillRect(r()*14|0,r()*14|0,3,2);}
  g.fillStyle='#9a9aa2';for(let i=0;i<5;i++)g.fillRect(r()*14|0,r()*14|0,2,1);
  g.fillStyle='#5e5e66';g.fillRect(r()*8|0,r()*8|0,5,1);g.fillRect(r()*8|0,8+r()*8|0,4,1);
});
TEX[WOOD]=mkTex((g,r)=>{
  g.fillStyle='#7a5a34';g.fillRect(0,0,16,16);
  g.fillStyle='#6a4c2a';for(let x=1;x<16;x+=4)g.fillRect(x,0,1,16);
  g.fillStyle='#8a6a40';for(let x=3;x<16;x+=5)g.fillRect(x,0,1,16);
  g.fillStyle='#5a3f24';g.fillRect(2,3,1,3);g.fillRect(9,7,1,4);g.fillRect(13,2,1,3);
});
TEX[LEAF]=mkTex((g,r)=>{
  // 树冠：圆润轮廓（角落镂空）+ 多层明暗
  g.clearRect(0,0,16,16);
  g.fillStyle='#3e7d34';g.fillRect(2,2,12,12);
  g.fillRect(0,5,16,7);g.fillRect(5,0,7,16);
  g.fillStyle='#4a8a3e';g.fillRect(3,3,10,3);g.fillRect(3,7,4,6);g.fillRect(9,6,4,5);
  g.fillStyle='#5a9a4c';g.fillRect(4,4,4,3);g.fillRect(9,8,3,3);g.fillRect(5,9,2,2);
  g.fillStyle='#2e5d28';g.fillRect(2,12,12,2);g.fillRect(12,4,2,8);g.fillRect(4,5,1,2);
  g.clearRect(0,0,2,2);g.clearRect(14,0,2,2);g.clearRect(0,14,2,2);g.clearRect(14,14,2,2);
  for(let i=0;i<5;i++)g.clearRect(1+(r()*14|0),1+(r()*14|0),1,1);
});
TEX[SAND]=mkTex((g,r)=>{
  g.fillStyle='#d9c06a';g.fillRect(0,0,16,16);
  for(let i=0;i<12;i++){g.fillStyle=r()<.5?'#c9b058':'#e8d07a';g.fillRect(r()*16|0,r()*16|0,1,1);}
});
TEX[PLANK]=mkTex((g,r)=>{
  g.fillStyle='#b3945a';g.fillRect(0,0,16,16);
  for(let y=0;y<16;y+=5){g.fillStyle='#96794a';g.fillRect(0,y,16,1);}
  g.fillStyle='#7a6238';for(let y=0;y<16;y+=5){g.fillRect(2+((y*3)%11),y+1,1,1);g.fillRect(11,y+3,1,1);}
});
TEX[COAL]=mkTex((g,r)=>{
  g.fillStyle='#8a8a92';g.fillRect(0,0,16,16);
  for(let i=0;i<6;i++){g.fillStyle='#76767e';g.fillRect(r()*14|0,r()*14|0,3,2);}
  for(let i=0;i<5;i++){g.fillStyle='#2a2a2e';g.fillRect(r()*13|0,r()*13|0,3,3);}
});
TEX[IRON]=mkTex((g,r)=>{
  g.fillStyle='#8a8a92';g.fillRect(0,0,16,16);
  for(let i=0;i<6;i++){g.fillStyle='#76767e';g.fillRect(r()*14|0,r()*14|0,3,2);}
  for(let i=0;i<4;i++){g.fillStyle='#d9a06a';g.fillRect(r()*13|0,r()*13|0,3,2);}
  g.fillStyle='#e8c08a';for(let i=0;i<3;i++)g.fillRect(r()*13|0,r()*13|0,1,1);
});
TEX[GOLD]=mkTex((g,r)=>{
  g.fillStyle='#8a8a92';g.fillRect(0,0,16,16);
  for(let i=0;i<6;i++){g.fillStyle='#76767e';g.fillRect(r()*14|0,r()*14|0,3,2);}
  for(let i=0;i<4;i++){g.fillStyle='#e8c04b';g.fillRect(r()*13|0,r()*13|0,3,2);}
  g.fillStyle='#fff0a0';for(let i=0;i<3;i++)g.fillRect(r()*13|0,r()*13|0,1,1);
});
TEX[GEM]=mkTex((g,r)=>{
  g.fillStyle='#7a7a86';g.fillRect(0,0,16,16);
  for(let i=0;i<6;i++){g.fillStyle='#68687a';g.fillRect(r()*14|0,r()*14|0,3,2);}
  for(let i=0;i<3;i++){g.fillStyle='#9a6ae0';const x=r()*11|0,y=r()*11|0;g.fillRect(x,y,4,3);g.fillRect(x+1,y-1,2,2);}
  g.fillStyle='#d0aef8';for(let i=0;i<4;i++)g.fillRect(r()*13|0,r()*13|0,1,1);
  g.fillStyle='#5a3aa8';for(let i=0;i<3;i++)g.fillRect(r()*13|0,r()*13|0,1,1);
});
const CRACK=[];
for(let s=0;s<4;s++){
  const c=document.createElement('canvas');c.width=c.height=16;
  const g=c.getContext('2d');g.strokeStyle='#000000aa';g.lineWidth=1;
  let sd=s*31+7;const rnd=()=>{sd=(sd*16807)%2147483647;return sd/2147483647;};
  for(let i=0;i<=s+1;i++){
    g.beginPath();let x=8,y=8;g.moveTo(x,y);
    for(let j=0;j<3;j++){x+=(rnd()-.5)*16;y+=(rnd()-.5)*16;g.lineTo(x,y);}
    g.stroke();
  }
  CRACK.push(c);
}
TEX[BRICK]=mkTex((g,r)=>{
  g.fillStyle='#9a5a48';g.fillRect(0,0,16,16);
  g.fillStyle='#7a4436';
  g.fillRect(0,4,16,1);g.fillRect(0,10,16,1);
  g.fillRect(5,0,1,4);g.fillRect(11,5,1,5);g.fillRect(3,11,1,5);g.fillRect(12,11,1,5);
  g.fillStyle='#ad6b57';g.fillRect(1,1,3,2);g.fillRect(8,6,3,2);g.fillRect(6,12,3,2);
});
TEX[GLASS]=mkTex((g,r)=>{
  g.fillStyle='#cfe4ec55';g.fillRect(0,0,16,16);
  g.strokeStyle='#e8f4f8cc';g.lineWidth=1;g.strokeRect(0.5,0.5,15,15);
  g.fillStyle='#ffffff66';g.fillRect(2,2,5,1);g.fillRect(2,3,3,1);g.fillRect(9,11,4,1);
});
TEX[BED]=mkTex((g,r)=>{
  g.fillStyle='#6e4c2a';g.fillRect(0,10,16,6);
  g.fillStyle='#8a6238';g.fillRect(0,8,16,3);
  g.fillStyle='#e0dcd0';g.fillRect(1,6,9,4);
  g.fillStyle='#c94f4f';g.fillRect(10,7,5,3);
});
TEX[BENCH]=mkTex((g,r)=>{
  g.fillStyle='#8a6238';g.fillRect(0,0,16,16);
  g.fillStyle='#9a7246';g.fillRect(0,0,16,5);
  g.fillStyle='#6e4c2a';g.fillRect(1,10,3,6);g.fillRect(12,10,3,6);
  g.fillStyle='#c9c9c9';g.fillRect(3,1,3,1);g.fillRect(10,2,4,1);
  g.fillStyle='#5a5a5a';g.fillRect(4,1,1,2);
});
TEX[FURNACE]=mkTex((g,r)=>{
  g.fillStyle='#6a6a72';g.fillRect(0,0,16,16);
  g.fillStyle='#55555c';g.fillRect(1,1,14,14);
  g.fillStyle='#3a3a42';g.fillRect(3,4,10,9);
  g.fillStyle='#ff7a2a';g.fillRect(5,7,6,5);
  g.fillStyle='#ffb04a';g.fillRect(6,8,4,3);
  g.fillStyle='#8a8a92';g.fillRect(0,0,16,2);
});
TEX[WATER]=mkTex((g,r)=>{
  g.fillStyle='#3a6ac9aa';g.fillRect(0,0,16,16);
  g.fillStyle='#5a8ae066';for(let y=2;y<16;y+=5)g.fillRect(0,y,16,1);
});
TEX[TALLGRASS]=mkTex((g,r)=>{
  g.clearRect(0,0,16,16);
  for(let i=0;i<6;i++){
    const x=2+i*2+((r()*2)|0);
    g.fillStyle=r()<.5?'#5a9a4c':'#4a7d36';
    g.fillRect(x,5+((r()*3)|0),1,11-((r()*3)|0));
  }
});
TEX[VINE]=mkTex((g,r)=>{
  g.clearRect(0,0,16,16);
  g.fillStyle='#3e6a38';
  for(let y=0;y<16;y+=3)g.fillRect(7+((r()*3)|0)-1,y,2,3);
  g.fillStyle='#5a9a4c';for(let i=0;i<3;i++)g.fillRect(6+((r()*4)|0),r()*16|0,2,2);
});
TEX[MUSH]=mkTex((g,r)=>{
  g.clearRect(0,0,16,16);
  g.fillStyle='#e8e0d0';g.fillRect(6,9,4,6);
  g.fillStyle='#c94f4f';g.fillRect(3,5,10,5);
  g.fillStyle='#e8e0d0';g.fillRect(5,6,2,2);g.fillRect(10,7,2,2);g.fillRect(8,5,1,1);
});
TEX[SHROOM]=mkTex((g,r)=>{
  g.clearRect(0,0,16,16);
  g.fillStyle='#d9cfc0';g.fillRect(7,10,3,5);
  g.fillStyle='#5a8ac9';g.fillRect(4,6,9,4);
  g.fillStyle='#a8c8e8';g.fillRect(6,7,2,1);g.fillRect(10,7,2,1);
});
TEX[CACTUS]=mkTex((g,r)=>{
  g.clearRect(0,0,16,16);
  g.fillStyle='#4a7d3a';g.fillRect(6,0,4,16);
  g.fillStyle='#5a9a4a';g.fillRect(6,0,1,16);
  g.fillStyle='#3a6a30';for(let y=2;y<16;y+=4)g.fillRect(8,y,1,2);
  g.fillStyle='#e8e0d0';for(let y=1;y<16;y+=3){g.fillRect(5,y,1,1);g.fillRect(10,y+1,1,1);}
});
// —— 更精细的植被贴图 ——
TEX[BERRY]=mkTex((g,r)=>{ // 浆果灌木
  g.clearRect(0,0,16,16);
  g.fillStyle='#3e6a38';
  g.fillRect(3,8,10,8);g.fillRect(5,5,6,4);g.fillRect(1,10,3,5);g.fillRect(12,10,3,5);
  g.fillStyle='#4a7d46';g.fillRect(4,7,3,2);g.fillRect(9,9,3,2);
  for(let i=0;i<4;i++){g.fillStyle='#c94f6a';g.fillRect(3+r()*10|0,6+r()*8|0,2,2);}
});
TEX[BUSH]=mkTex((g,r)=>{ // 圆灌木
  g.clearRect(0,0,16,16);
  g.fillStyle='#4a8a3e';
  g.fillRect(4,7,8,8);g.fillRect(6,4,4,4);g.fillRect(2,9,4,5);g.fillRect(10,9,4,5);
  g.fillStyle='#5a9a4c';g.fillRect(6,5,2,2);g.fillRect(9,8,2,2);g.fillRect(4,10,2,2);
  g.fillStyle='#3a6e30';g.fillRect(5,12,6,3);
});
TEX[FERN]=mkTex((g,r)=>{ // 蕨
  g.clearRect(0,0,16,16);
  g.strokeStyle='#4a8a3e';g.lineWidth=1;
  for(let i=0;i<5;i++){
    const bx=8+(i-2)*2.5;
    g.beginPath();g.moveTo(8,15);
    g.quadraticCurveTo(bx,9,bx+(i-2)*1.5,3+((r()*3)|0));
    g.stroke();
  }
});
TEX[SAPLING]=mkTex((g,r)=>{ // 树苗
  g.clearRect(0,0,16,16);
  g.fillStyle='#8a6238';g.fillRect(7,9,2,7);
  g.fillStyle='#5a9a4c';g.fillRect(4,5,8,5);g.fillRect(6,2,4,3);
  g.fillStyle='#6ab05c';g.fillRect(6,5,2,2);g.fillRect(9,3,2,2);
});
// 玩家精灵：4 帧走路 + 跳跃 + 站立（像素手绘，随护甲换配色）
const ARMOR_TINT=[[['#c96f4a','#a85a38'],'#7a3f28'],[['#5fae64','#478a4e'],'#2e6b38'],[['#aeb4c0','#8a909e'],'#5f6672'],[['#e2b64a','#c2952e'],'#8a6a1e'],[['#9a6ae0','#7a4ac0'],'#4a2e8a']];
function buildPF(tier){
  const TT=ARMOR_TINT[tier]||ARMOR_TINT[0];
  function frame(legs,arms,jump){
    const c=document.createElement('canvas');c.width=14;c.height=22;
    const g=c.getContext('2d');
    const L='#3a5a8a',S='#4a3626',T=TT[0],T2=TT[1],SK='#e0b088',SK2='#c9966e',H='#2a2118',H2='#4a3a28';
    if(jump){
      g.fillStyle=L;g.fillRect(3,16,3,4);g.fillRect(8,16,3,4);
      g.fillStyle=S;g.fillRect(2,19,4,2);g.fillRect(8,19,4,2);
    }else{
      const l0=legs[0],l1=legs[1];
      g.fillStyle=L;g.fillRect(3+l0,16,3,5);g.fillRect(8+l1,16,3,5);
      g.fillStyle='#2e4a72';g.fillRect(3+l0,19,3,2);g.fillRect(8+l1,19,3,2);
      g.fillStyle=S;g.fillRect(2+l0,20,4,2);g.fillRect(7+l1,20,4,2);
    }
    g.fillStyle=T;g.fillRect(2,9,10,7);
    g.fillStyle=T2;g.fillRect(2,13,10,3);
    g.fillStyle=TT[1];g.fillRect(2,12,10,1);
    g.fillStyle='#ffffff33';g.fillRect(3,9,3,5);
    const a0=jump?-1:arms[0],a1=jump?1:arms[1];
    g.fillStyle=SK;g.fillRect(0,9+a0,2,6);g.fillRect(12,9+a1,2,6);
    g.fillStyle=SK2;g.fillRect(0,13+a0,2,2);g.fillRect(12,13+a1,2,2);
    g.fillStyle=SK;g.fillRect(3,1,8,8);
    g.fillStyle=SK2;g.fillRect(3,6,1,3);
    g.fillStyle=H;g.fillRect(2,0,10,2);g.fillRect(3,0,2,6);g.fillRect(2,0,1,4);
    g.fillStyle=H2;g.fillRect(4,0,5,1);
    g.fillStyle='#1c1812';g.fillRect(7,4,1,2);
    g.fillStyle='#b07a52';g.fillRect(7,7,2,1);
    return c;

let world=[];
function gen(){
  world=Array.from({length:WH},()=>Array(WW).fill(AIR));
  const surf=[];
  for(let x=0;x<WW;x++){
    const h=Math.sin(x*0.11)*3+Math.sin(x*0.04)*5+Math.sin(x*0.023)*2;
    surf[x]=Math.round(WH*0.4+h);
    for(let y=surf[x];y<WH;y++){
      let b=DIRT;
      if(y===surf[x])b=GRASS;
      else if(y>surf[x]+4+Math.sin(x*0.3)*2)b=STONE;
      world[y][x]=b;
    }
  }
  for(let i=0;i<10;i++){
    let cx=10+Math.random()*(WW-20), cy=surf[0]+8+Math.random()*(WH-surf[0]-14);
    const len=30+Math.random()*60;
    for(let j=0;j<len;j++){
      for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
        const x=Math.round(cx)+dx,y=Math.round(cy)+dy;
        if(x>1&&x<WW-1&&y>2&&y<WH-1&&world[y][x]!==AIR)world[y][x]=AIR;
      }
      cx+=(Math.random()-.5)*2;cy+=(Math.random()-.4)*1.2;
      cy=Math.max(surf[0]+6,Math.min(WH-4,cy));
    }
  }
  function vein(b,n,depth){
    for(let i=0;i<n;i++){
      const x=4+(Math.random()*(WW-8))|0, y=(surf[0]+6+Math.random()*depth)|0;
      if(y>=WH-2)continue;
      for(let j=0;j<4+Math.random()*5;j++){
        const xx=x+(Math.random()*3-1)|0, yy=y+(Math.random()*3-1)|0;
        if(xx>=0&&xx<WW&&yy>=0&&yy<WH&&world[yy][xx]===STONE)world[yy][xx]=b;
      }
    }
  }
  vein(COAL,10,10);vein(IRON,7,16);vein(GOLD,4,24);vein(GEM,9,20);
  for(let x=6;x<WW-6;x+=5+((Math.random()*5)|0)){
    let y=0;while(y<WH-1&&world[y+1][x]===AIR)y++;
    if(world[y][x]!==GRASS)continue;
    const th=4+((Math.random()*4)|0);
    for(let i=1;i<=th;i++)world[y-i][x]=WOOD;
    // 更饱满的树冠
    for(let dy=-2;dy<=1;dy++)for(let dx=-2;dx<=2;dx++){
      const yy=y-th+dy,xx=x+dx;
      if(yy>0&&xx>=0&&xx<WW&&(Math.abs(dx)+Math.abs(dy)<3||Math.random()<.5)&&world[yy][xx]===AIR)world[yy][xx]=LEAF;
    }
    // 树冠顶部加一撮
    if(world[y-th-3]&&world[y-th-3][x]===AIR)world[y-th-3][x]=LEAF;
  }
  for(let x=2;x<WW-2;x++){
    if(world[surf[x]][x]===GRASS&&world[surf[x]-1][x]===AIR&&Math.random()<.55){
      const r=Math.random();
      world[surf[x]-1][x]=
        r<.18?FLOWER: r<.32?GRASS2: r<.48?TALLGRASS:
        r<.60?MUSH:   r<.72?BUSH:  r<.84?FERN:
        r<.94?BERRY: SAPLING;
    }
  }
  // 树林里偶尔加一丛灌木在树边
  for(let x=6;x<WW-6;x++){
    if(world[surf[x]][x]===GRASS&&world[surf[x]-1][x]===AIR&&Math.random()<.15){
      world[surf[x]-1][x]=Math.random()<.5?BUSH:FERN;
    }
  }
  // 沙地仙人掌
  for(let x=3;x<WW-3;x++){
    if(world[surf[x]][x]===SAND&&world[surf[x]-1][x]===AIR&&Math.random()<.3){
      const h=1+((Math.random()*3)|0);
      for(let i=1;i<=h;i++)world[surf[x]-i][x]=CACTUS;
    }
  }
  // 洞穴蘑菇 + 藤蔓垂下来
  for(let x=2;x<WW-2;x++){
    for(let y=surf[x]+3;y<WH-2;y++){
      if(world[y][x]!==AIR)continue;
      if(world[y+1][x]===STONE&&Math.random()<.12)world[y][x]=Math.random()<.5?MUSH:SHROOM;
      if(world[y-1]&&world[y-1][x]===STONE&&Math.random()<.1){
        const len=1+((Math.random()*4)|0);
        for(let i=0;i<len&&world[y+i][x]===AIR;i++)world[y+i][x]=VINE;
      }
    }
  }
  // 地下含水层：低洼洞穴里灌水
  for(let x=4;x<WW-4;x++){
    const y=WH-6-((Math.sin(x*0.2)+1)*2|0);
    if(world[y][x]===AIR)world[y][x]=WATER;
    if(y+1<WH&&world[y+1][x]===AIR)world[y+1][x]=WATER;
  }
  // 深处熔岩湖：世界底部填满，加密集熔岩池 + 最底层熔岩海
  for(let x=1;x<WW-1;x++)for(let y=WH-4;y<WH;y++){
    if(world[y][x]===AIR)world[y][x]=LAVA;
  }
  for(let x=2;x<WW-2;x++)for(let y=WH-2;y<WH;y++){
    if(world[y][x]===STONE&&Math.random()<.45)world[y][x]=LAVA;
  }
  for(let i=0;i<24;i++){
    const cx=3+((Math.random()*(WW-6))|0),cy=(WH-10+Math.random()*5)|0;
    const n=3+((Math.random()*4)|0);
    for(let j=0;j<n;j++){
      const xx=cx+((Math.random()*3-1)|0),yy=cy+((Math.random()*3-1)|0);
      if(xx>0&&xx<WW-1&&yy>WH-13&&yy<WH-2&&world[yy][xx]===AIR)world[yy][xx]=LAVA;
    }
  }
  return surf;
}

function relight(){
  for(let x=0;x<WW;x++){
    let lv=15;
    for(let y=0;y<WH;y++){
      const b=world[y][x];
      if(b!==AIR&&b!==FLOWER&&b!==GRASS2&&b!==TORCH&&b!==GLASS&&b!==WATER&&b!==VINE&&b!==MUSH&&b!==SHROOM&&b!==TALLGRASS&&b!==BUSH&&b!==FERN&&b!==SAPLING&&b!==BERRY)lv-= b===LEAF?1.5:4;
      lv=Math.max(0,lv);
      light[y][x]=lv;
    }
  }
  for(let y=0;y<WH;y++)for(let x=0;x<WW;x++){
    if(world[y][x]!==TORCH)continue;
    for(let dy=-5;dy<=5;dy++)for(let dx=-5;dx<=5;dx++){
      const yy=y+dy,xx=x+dx;
      if(yy<0||yy>=WH||xx<0||xx>=WW)continue;
      const d=Math.hypot(dx,dy);
      const lv=Math.max(0,14-d*2.4);
      if(lv>light[yy][xx])light[yy][xx]=lv;
    }
  }
  // 熔岩自身发光
  for(let y=0;y<WH;y++)for(let x=0;x<WW;x++){
    if(world[y][x]!==LAVA)continue;
    for(let dy=-6;dy<=6;dy++)for(let dx=-6;dx<=6;dx++){
      const yy=y+dy,xx=x+dx;
      if(yy<0||yy>=WH||xx<0||xx>=WW)continue;
      const d=Math.hypot(dx,dy);
      const lv=Math.max(0,15-d*2.0);
      if(lv>light[yy][xx])light[yy][xx]=lv;
    }
  }
  // 宝石矿微光
  for(let y=0;y<WH;y++)for(let x=0;x<WW;x++){
    if(world[y][x]!==GEM)continue;
    for(let dy=-3;dy<=3;dy++)for(let dx=-3;dx<=3;dx++){
      const yy=y+dy,xx=x+dx;
      if(yy<0||yy>=WH||xx<0||xx>=WW)continue;
      const d=Math.hypot(dx,dy);
      const lv=Math.max(0,7-d*1.6);
      if(lv>light[yy][xx])light[yy][xx]=lv;
    }
  }
}

function tone(f0,f1,dur,type,vol){
  if(!AC)return;
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f0,AC.currentTime);
  o.frequency.exponentialRampToValueAtTime(Math.max(30,f1),AC.currentTime+dur);
  g.gain.setValueAtTime(vol,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+dur);
  o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+dur);
}

  const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=ff||800;

  else{

      const fall=e.vy;
      e.y=Math.floor((e.y+e.vy+e.h/2)/T)*T-e.h/2;e.ground=true;
      if(isPlayer&&fall>10.5){
        hurt(Math.min(4,Math.floor((fall-9)/1.6)));
        burst(P.x,P.y+P.h/2,'#c9b48a',8);sfx('land');flash('摔伤了');
      }else if(isPlayer&&fall>7){burst(P.x,P.y+P.h/2,'#c9b48a',4);sfx('land');}
    }
    e.vy=0;
  }
  e.x=Math.max(e.w/2,Math.min(WW*T-e.w/2,e.x));
}
function hurt(n){
  if(n<=0||P.hurt>0)return;
  n=Math.max(1,n-ARMOR_DEF[armorTier]);
  P.hp-=n;P.hurt=40;sfx('hurt');lastHurtAt=frameN;
  if(P.hp<=0){
    P.hp=P.maxHp;coins=Math.max(0,Math.floor(coins*0.8));
    let s;
    if(bedX!==null&&world[bedY]&&world[bedY][bedX]===BED){
      s={x:bedX*T+T/2,y:bedY*T-P.h/2};
    }else s=findSpawn();
    P.x=s.x;P.y=s.y;P.vx=0;P.vy=0;
    flash('你倒下了，在坡上醒来（-20%◈）');
  }
  hud();
}

function worldAt(mx,my){
  const z=cam.z,ox=W/2-P.x*z,oy=H*0.55-P.y*z;
  return [Math.floor((mx-ox)/(T*z)),Math.floor((my-oy)/(T*z))];
}
function reach(gx,gy){return Math.hypot(gx*T+T/2-P.x,gy*T+T/2-P.y)<T*5.5;}

/* ================= 挖掘 / 放置 ================= */
let digT=0,digTarget=null,digNeed=0;
const HARD={[GRASS]:[260,'hoe'],[DIRT]:[240,'hoe'],[SAND]:[200,'hoe'],[STONE]:[700,'pick'],
  [COAL]:[800,'pick'],[IRON]:[1000,'pick'],[GOLD]:[1200,'pick'],[GEM]:[1800,'pick'],[WOOD]:[600,'axe'],
  [LEAF]:[120,'axe'],[PLANK]:[400,'axe'],[TORCH]:[80,'hoe'],[FLOWER]:[60,'hoe'],[GRASS2]:[60,'hoe'],
  [GLASS]:[120,'pick'],[BRICK]:[600,'pick'],[TALLGRASS]:[50,'hoe'],[VINE]:[60,'axe'],[MUSH]:[60,'hoe'],[SHROOM]:[60,'hoe'],[CACTUS]:[200,'axe'],
  [BUSH]:[100,'axe'],[FERN]:[50,'hoe'],[SAPLING]:[60,'axe'],[BERRY]:[80,'hoe']};
const DROP={[GRASS]:DIRT,[DIRT]:DIRT,[SAND]:SAND,[STONE]:STONE,[COAL]:'coal',[IRON]:'iron',
  [GOLD]:'gold',[GEM]:'gem',[WOOD]:WOOD,[PLANK]:PLANK,[TORCH]:TORCH,[GLASS]:GLASS,[BRICK]:BRICK};

function digStep(dt){
  const [gx,gy]=worldAt(mouse.x,mouse.y);
  if(!reach(gx,gy)){digT=0;digTarget=null;return;}
  const b=world[gy]&&world[gy][gx];
  if(!b||b===AIR){digT=0;digTarget=null;return;}
  if(b===WATER){digT=0;digTarget=null;return;}
  if(b===LAVA){digT=0;digTarget=null;flash('太烫了，挖不动');return;}
  // 设施类：徒手右键已处理，左键仍可拆
  if(b===BED||b===BENCH||b===FURNACE){
  world[gy][gx]=AIR;INV[b]=(INV[b]||0)+1;
  if(b===BED){bedX=null;bedY=null;}
  burst(gx*T+T/2,gy*T+T/2,'#8a6238',8);relight();hud();digT=0;digTarget=null;
  flash('拆回了 '+NM[b]);return;
  }
  if(digTarget&&(digTarget[0]!==gx||digTarget[1]!==gy))digT=0;
  digTarget=[gx,gy];
  const [base,tool]=HARD[b]||[300,'hoe'];
  const toolOk=(ITEMS[sel].k===tool);
  const mult=toolOk?(SPEED[toolTier[tool]]||1):1;
  const need=toolOk?base/mult:base*3;
  digNeed=need;digT+=dt;
  if(digT%120<dt)sfx(b===STONE||b===COAL||b===IRON||b===GOLD||b===GEM?'stone':'dig');
  P.face=(gx*T+T/2>P.x)?1:-1;
  P.swing=10;
  if(digT>=need){
    world[gy][gx]=AIR;
    const dk=DROP[b];
    if(dk)spawnDrop(gx,gy,dk);
    else if(b===LEAF&&Math.random()<.15)spawnDrop(gx,gy,'seed');
    const col={5:'#4a8a3e',1:'#5c9a44',6:'#d9c06a',4:'#8a6238',7:'#b3945a',9:'#2a2a2e',10:'#d9a06a',11:'#e8c04b',3:'#8a8a92'}[b]||'#7a5a3a';
    burst(gx*T+T/2,gy*T+T/2,col,10);
    relight();digT=0;digTarget=null;hud();
  }
}
function placeAt(){
  const [gx,gy]=worldAt(mouse.x,mouse.y);
  if(gx<0||gx>=WW||gy<0||gy>=WH||!reach(gx,gy))return;
  const b=world[gy][gx];
  const it=ITEMS[sel];
  if(it.k==='wheat'){
    if(seeds.wheat>0&&(b===AIR||b===GRASS2)){
      const below=world[gy+1]&&world[gy+1][gx];
      if(below===GRASS||below===DIRT){
        seeds.wheat--;crops.push({x:gx,y:gy,age:0});flash('种下了');sfx('plant');hud();
      }else flash('要种在草地上');
    }else if(seeds.wheat<=0)flash('没种子了');
    return;
  }
  if(it.k==='hoe'){
    const ci=crops.findIndex(c=>c.x===gx&&c.y===gy);
    if(ci>=0){
      if(crops[ci].age>=3){
        coins+=5;harv++;crops.splice(ci,1);
        burst(gx*T+T/2,gy*T+T/2,'#d9b84b',8);
        if(Math.random()<.6){seeds.wheat++;flash('收获 +5◈，还掉了种子');}
        else flash('收获 +5◈');
        sfx('pick');
        try{parent.postMessage({type:'farm-harvest',value:5,total:harv},'*');}catch(e){}
        hud();
      }else flash('还没熟');
    }
    return;
  }
  if(typeof it.k==='number'){
    const kb=it.k;
    if((INV[kb]||0)>0&&(b===AIR||b===FLOWER||b===GRASS2||b===WATER)){
      const pxg=Math.floor(P.x/T),pyg=Math.floor(P.y/T);
      const solidB=!(kb===TORCH||kb===WATER);
      if(solidB&&(gx===pxg&&(gy===pyg||gy===pyg-1)))return;
      world[gy][gx]=kb;INV[kb]--;relight();
      if(kb===BED){bedX=gx;bedY=gy;flash('设好重生点');}
      burst(gx*T+T/2,gy*T+T/2,'#9a8a6a',4);
      sfx('place');hud();
    }else if((INV[kb]||0)<=0)flash('没有了');
  }
}

/* ---------- 睡觉 / 与设施互动 ---------- */
function interactAt(gx,gy){
  const b=world[gy]&&world[gy][gx];
  if(b===BED){
    if(!isNight()){flash('天还没黑');return true;}
    // 睡觉：快进到清晨，回满血
    dayT=0.24;day++;P.hp=P.maxHp;bedX=gx;bedY=gy;
    sfx('sleep');flash('睡了一觉，天亮了');hud();
    return true;
  }
  if(b===BENCH||b===FURNACE){toggleCraft();return true;}
  return false;
}

/* ---------- 合成 ---------- */
let craftOpen=false;
function nearStation(){
  const pxg=Math.floor(P.x/T),pyg=Math.floor(P.y/T);
  for(let dy=-3;dy<=3;dy++)for(let dx=-3;dx<=3;dx++){
    const b=world[pyg+dy]&&world[pyg+dy][pxg+dx];
    if(b===BENCH||b===FURNACE)return b;
  }
  return null;
}
function canCraft(r){
  const st=nearStation();
  if(r.near&&st!==r.near)return false;
  for(const k in r.need){
    const have=(k==='coal'||k==='iron'||k==='gold'||k==='gel'||k==='gem')?mats[k]:(INV[k]||0);
    if(have<r.need[k])return false;
  }
  return true;
}
function needText(r){
  const nm={coal:'煤',iron:'铁',gold:'金',gel:'凝胶',gem:'宝石'};
  return Object.entries(r.need).map(([k,v])=>{
    const n=nm[k]||NM[k]||({[WOOD]:'木头',[SAND]:'沙',[STONE]:'石头',[PLANK]:'木板'}[k]||k);
    return n+'×'+v;
  }).join(' ');
}
function renderCraft(){
  const el=document.getElementById('craftList');el.innerHTML='';
  document.getElementById('mcoal').textContent=mats.coal;
  document.getElementById('miron').textContent=mats.iron;
  document.getElementById('mgold').textContent=mats.gold;
  document.getElementById('mgel').textContent=mats.gel;
  document.getElementById('mgem').textContent=mats.gem;
  const st=nearStation();
  RECIPES.forEach(r=>{
    if(r.near&&st!==r.near){
      // 只提示，不给点
    }
    const ok=canCraft(r);
    const row=document.createElement('div');
    row.className='crow'+(ok?'':' no');
    row.innerHTML=`<span>${r.name}</span><span class="need">${needText(r)}${r.near?' @'+(r.near===FURNACE?'熔炉':'工作台'):''}</span>`;
    if(ok)row.onclick=()=>{
      if(r.out==='tool'&&toolTier[r.tool]>=r.tier){flash('已经有更好的了');return;}
      if(r.out==='armor'&&armorTier>=r.tier){flash('已经有更好的护甲了');return;}
      if(r.out==='boss'&&mobs.some(m=>m.type==='boss')){flash('史莱姆王已经来了');return;}
      for(const k in r.need){
        if(k==='coal'||k==='iron'||k==='gold'||k==='gel'||k==='gem')mats[k]-=r.need[k];
        else INV[k]-=r.need[k];
      }
      if(r.out==='tool'){
        toolTier[r.tool]=r.tier;
        sfx('upgrade');flash(`换上了${TIER_NAME[r.tier]}${TOOL_META[r.tool]}，挖得更快！`);
      }else if(r.out==='armor'){
        armorTier=r.tier;P.maxHp=10+ARMOR_HP[r.tier];
        P.hp=Math.min(P.maxHp,P.hp+ARMOR_HP[r.tier]);
        PF=buildPF(armorTier);
        sfx('upgrade');flash(`穿上了${ARMOR_NAME[r.tier]}，血上限+${ARMOR_HP[r.tier]}`);
      }else if(r.out==='boss'){
        spawnBoss();sfx('boss');flash('史莱姆王降临了！');
      }else{
        INV[r.out]=(INV[r.out]||0)+r.n;
        sfx('craft');flash('做出了 '+r.name);
      }
      renderCraft();hud();
    };
    el.appendChild(row);
  });
}
function toggleCraft(){
  craftOpen=!craftOpen;
  document.getElementById('craft').style.display=craftOpen?'block':'none';
  if(craftOpen)renderCraft();
}
document.getElementById('craftX').onclick=()=>toggleCraft();

/* ---------- 冶炼：对着熔炉左键铁矿/金矿 ---------- */

/* ================= 更新 ================= */
let coyote=0,cropT=0,frameN=0;
function isNight(){return dayT>0.78||dayT<0.22;}
function daylight(){
  const t=dayT;
  if(t<0.22)return Math.max(0.15,t/0.22);
  if(t<0.72)return 1;
  if(t<0.82)return 1-(t-0.72)/0.1*0.85;
  return 0.15;
}
function update(dt){
  if(keys['a']){P.vx-=MOVE;P.face=-1;P.walk++;}
  if(keys['d']){P.vx+=MOVE;P.face=1;P.walk++;}
  if(!keys['a']&&!keys['d'])P.vx*=0.8;
  if(P.ground)coyote=8;else if(coyote>0)coyote--;
  const inW=inWater(P);
  if((keys['w']||keys[' '])&&(coyote>0||inW)){
    P.vy=inW?Math.max(P.vy-1.2,-3):JUMP;coyote=0;
    if(!inW)sfx('jump');else sfx('splash');
    burst(P.x,P.y+P.h/2,inW?'#3a6ac9':'#b3a98e',4);
  }
  if(inW){P.vy*=0.94;P.vx*=0.9;}
  // 熔岩：烫伤 + 弹起
  if(inLava(P)){
    hurt(2);P.vy=-6.2;
    if(frameN%12===0)sfx('sizzle');
    burst(P.x,P.y+P.h/2,'#ff8a2a',3);
  }
  // 缓慢回血：距上次受伤约 15 秒后，每 5 秒回 1 点
  if(frameN-lastHurtAt>900&&P.hp<P.maxHp){
    regenAcc+=dt;
    if(regenAcc>5000){regenAcc=0;P.hp++;hud();}
  }else regenAcc=0;
  phys(P,true);
  if(P.hurt>0)P.hurt--;
  if(P.swing>0)P.swing--;
  if(mouse.down===1)digStep(dt);else{digT=0;digTarget=null;}
  // 怪物（史莱姆 / 僵尸）
  for(let i=mobs.length-1;i>=0;i--){
    const m=mobs[i];
    if(inLava(m)){burst(m.x,m.y,'#ff8a2a',10);mobs.splice(i,1);continue;}
    if(m.type==='zombie'&&!isNight()){
      burst(m.x,m.y,'#9a9a9a',8);mobs.splice(i,1);flash('僵尸在晨光里化成了灰');continue;
    }
    if(m.type==='slime'){
      m.hop--;
      if(m.ground&&m.hop<=0){
        m.face=P.x>m.x?1:-1;
        m.vy=-5.2;m.vx=m.face*1.4;m.hop=40+Math.random()*40;
      }
      if(!m.ground)m.vx*=0.99;else m.vx*=0.8;
    }else if(m.type==='boss'){
      m.hop--;
      if(m.ground&&m.hop<=0){
        m.face=P.x>m.x?1:-1;
        m.vy=-8.5;m.vx=m.face*(1.5+Math.random()*0.9);m.hop=46+Math.random()*26;
        sfx('land');
      }
      if(!m.ground)m.vx*=0.995;else m.vx*=0.78;
      if(!m.fury&&m.hp<=BOSS_HP*0.5){
        m.fury=true;
        for(let k=0;k<2;k++)mobs.push({type:'slime',x:m.x+(k?46:-46),y:m.y-26,w:13,h:10,vx:0,vy:0,hp:3,hop:20,face:1,ground:false});
        flash('史莱姆王分裂了！');burst(m.x,m.y,'#6a8ae0',18);
      }
    }else{
      m.face=P.x>m.x?1:-1;
      if(m.ground){
        m.vx+=m.face*0.09;m.vx=Math.max(-0.68,Math.min(0.68,m.vx));
        if(Math.random()<0.015&&Math.abs(P.x-m.x)<T*3&&P.y<m.y-T)m.vy=-6.8;
      }
    }
    phys(m,false);
    if(Math.abs(m.x-P.x)<(m.w+P.w)/2&&Math.abs(m.y-P.y)<(m.h+P.h)/2){
      const dmg=m.type==='boss'?3:(m.type==='zombie'?2:1);
      hurt(dmg);
      P.vx=m.type==='boss'?(P.x>m.x?5:-5):(P.x>m.x?3:-3);
      P.vy=m.type==='boss'?-4.5:-3;
      sfx(m.type==='boss'?'boss':(m.type==='zombie'?'zombie':'slime'));
    }
  }
  // 打怪
  if(mouse.down===1){
    const z=cam.z,ox=W/2-P.x*z,oy=H*0.55-P.y*z;
    const wx=(mouse.x-ox)/z,wy=(mouse.y-oy)/z;
    for(let i=mobs.length-1;i>=0;i--){
      const m=mobs[i];
      const rad=m.w/2+6;
      if(Math.abs(wx-m.x)<rad&&Math.abs(wy-m.y)<m.h/2+6&&Math.hypot(wx-P.x,wy-P.y)<T*5.5){
        m.hp-=(m.type==='boss'?2:1);m.vx=(m.x>P.x?2.5:-2.5);m.vy=-2.5;
        burst(m.x,m.y,m.type==='boss'?'#6a8ae0':(m.type==='zombie'?'#7a9a5a':'#6ab04c'),7);sfx('dig');mouse.down=0;
        if(m.hp<=0){
          mobs.splice(i,1);
          if(m.type==='boss'){
            burst(m.x,m.y,'#6a8ae0',30);burst(m.x,m.y,'#e8c04b',14);
            for(let k=0;k<4;k++)spawnDrop(Math.floor(m.x/T)+(k-2),Math.floor(m.y/T),'coin');
            mats.gel+=4;mats.iron+=2;mats.gem+=1;
            sfx('boss');flash('击败了史莱姆王！掉了一地金币');
          }else if(m.type==='zombie'){
            burst(m.x,m.y,'#5a7a4a',16);
            spawnDrop(Math.floor(m.x/T),Math.floor(m.y/T),'coin');
            if(Math.random()<.5)spawnDrop(Math.floor(m.x/T),Math.floor(m.y/T),'iron');
            flash('击败了僵尸');
          }else{
            burst(m.x,m.y,'#6ab04c',16);
            spawnDrop(Math.floor(m.x/T),Math.floor(m.y/T),'gel');
            flash('击败了史莱姆');
          }
        }
        break;
      }
    }
  }
  // 掉落物
  for(let i=drops.length-1;i>=0;i--){
    const d=drops[i];
    d.vy+=0.3;d.vy=Math.min(d.vy,8);
    d.x+=d.vx;d.y+=d.vy;
    const gx=Math.floor(d.x/T),gy=Math.floor((d.y+4)/T);
    if(solid(gx,gy)){d.y=gy*T-4;d.vy=0;d.vx*=0.8;}
    d.life--;
    const dx=P.x-d.x,dy=P.y-d.y;
    if(Math.hypot(dx,dy)<T*3.2){d.x+=dx*0.15;d.y+=dy*0.15;}
    if(Math.hypot(dx,dy)<T*1.1||d.life<=0){
      if(d.life>0){
        if(d.kind==='coal')mats.coal++;
        else if(d.kind==='iron')mats.iron++;
        else if(d.kind==='gold')mats.gold++;
        else if(d.kind==='gel')mats.gel++;
        else if(d.kind==='gem')mats.gem++;
        else if(d.kind==='star'){coins+=10;flash('捡到坠星 +10◈');}
        else if(d.kind==='coin'){coins+=4;}
        else if(d.kind==='seed')seeds.wheat++;
        else INV[d.kind]=(INV[d.kind]||0)+1;
        sfx('pick');hud();
      }
      drops.splice(i,1);
    }
  }
  // 粒子
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];
    p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.life--;
    if(p.life<=0)parts.splice(i,1);
  }
  // 作物
  cropT+=dt;
  if(cropT>7000){cropT=0;for(const c of crops)if(c.age<3)c.age++;}
  // 昼夜
  dayT+=dt/150000;
  if(dayT>=1){dayT=0;day++;hud();}
  if(isNight()&&mobs.length<4&&Math.random()<dt/8000){
    if(Math.random()<.45)spawnMob('zombie');else spawnMob('slime');
  }
  if(!isNight()&&mobs.length>1&&Math.random()<dt/20000){
    const i=mobs.findIndex(m=>m.type!=='boss');
    if(i>=0)mobs.splice(i,1);
  }
  bossHud();
  // 夜里偶尔掉星星（砸在玩家附近，可捡）
  if(isNight()&&Math.random()<dt/12000){
    const sx=Math.max(2,Math.min(WW-3,Math.floor(P.x/T)+(Math.random()*30-15|0)));
    let gy=0;while(gy<WH&&world[gy][sx]===AIR)gy++;
    if(gy>1&&gy<WH)spawnDrop(sx,gy-1,'star');
  }
  for(const c of clouds){c.x+=c.v;if(c.x>WW*T)c.x=-c.w;}
  if(Math.random()<dt/15000&&birds.length<2)birds.push({x:-20,y:40+Math.random()*80,v:1.2+Math.random()});
  for(let i=birds.length-1;i>=0;i--){birds[i].x+=birds[i].v;if(birds[i].x>WW*T+20)birds.splice(i,1);}
  if(Math.random()<dt/3000){
    const x=Math.random()*WW*T,gx=Math.floor(x/T);
    for(let y=0;y<WH-1;y++)if(world[y][gx]===LEAF&&world[y+1]&&world[y+1][gx]===AIR){
      leaves.push({x,y:y*T+T,vy:0.3,ph:Math.random()*7,life:300});break;
    }
  }
  for(let i=leaves.length-1;i>=0;i--){
    const l=leaves[i];l.ph+=0.05;l.x+=Math.sin(l.ph)*0.4;l.y+=l.vy;l.life--;
    const gy=Math.floor(l.y/T);
    if(l.life<=0||(world[gy]&&solid(Math.floor(l.x/T),gy)))leaves.splice(i,1);
  }
}

/* ================= 渲染 ================= */
function lerpC(a,b,t){return[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];}
function rgb(c){return`rgb(${c[0]|0},${c[1]|0},${c[2]|0})`;}
function draw(){
  const z=cam.z;
  // 相机对齐到像素网格，防止抖动
  const ox=Math.round(W/2-P.x*z), oy=Math.round(H*0.55-P.y*z);
  const dl=daylight();
  let top=lerpC([20,26,46],[122,178,214],dl), bot=lerpC([40,46,66],[207,228,216],dl);
  const dk=Math.max(0,1-Math.abs(dayT-0.76)/0.07,1-Math.abs(dayT-0.24)/0.05);
  if(dk>0){top=lerpC(top,[176,110,120],dk*.55);bot=lerpC(bot,[244,176,120],dk*.7);}
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,rgb(top));g.addColorStop(1,rgb(bot));
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  if(dl<0.5){
    ctx.fillStyle='#ffffff';
    for(let i=0;i<40;i++){
      const sx=(h2(i,7)%W), sy=(h2(i,13)%(H*0.5));
      ctx.globalAlpha=Math.max(0,(0.5-dl)*2)*(((i%3)+1)/3);
      ctx.fillRect(sx,sy,2,2);
    }
    ctx.globalAlpha=1;
  }
  // 远景山峦（视差）
  {
    const col=Math.max(0,Math.min(WW-1,Math.floor(P.x/T)));
    const underground=P.y>(SURF[col]+6)*T;
    if(!underground){
      const fc=lerpC([48,56,80],[136,162,170],dl);
      const nc=lerpC([30,38,56],[98,132,108],dl);
      const drawHill=(spd,base,amp,c)=>{
        const hoff=ox*spd;
        ctx.fillStyle=c;
        ctx.beginPath();ctx.moveTo(0,H);
        for(let x=0;x<=W;x+=24){
          const wx=(x-hoff)*0.004;
          const y=base+Math.sin(wx*1.7)*amp*0.4+Math.sin(wx*0.6)*amp;
          ctx.lineTo(x,y);
        }
        ctx.lineTo(W,H);ctx.closePath();ctx.fill();
      };
      drawHill(0.22,H*0.5,26,rgb(fc));
      drawHill(0.45,H*0.62,20,rgb(nc));
    }
  }
  if(!isNight()){
    const mt=(dayT-0.22)/0.56;
    const sx=W/2+Math.cos(mt*Math.PI)*W*0.42, sy=H*0.42-Math.sin(mt*Math.PI)*H*0.3;
    ctx.fillStyle='#e8d06a';ctx.fillRect(sx-14,sy-14,28,28);
    ctx.fillStyle='#f5e89a';ctx.fillRect(sx-9,sy-9,18,18);
  }else{
    const mt=(dayT>0.78?(dayT-0.78):dayT+0.22)/0.44;
    const mx=W/2+Math.cos(mt*Math.PI)*W*0.42, my=H*0.4-Math.sin(mt*Math.PI)*H*0.28;

  for(const c of clouds){

      const rg2=ctx.createRadialGradient(sx+s/2,sy+s/2,2,sx+s/2,sy+s/2,s*3.4);

      ctx.fillStyle=rg2;ctx.fillRect(sx-s*3.4,sy-s*3.4,s*6.8,s*6.8);
      continue;
    }
    if(b===FLOWER){
      ctx.fillStyle='#3e6a38';ctx.fillRect(sx+s/2-1,sy+s*0.4,2,s*0.6);
      ctx.fillStyle=h2(x,y)%2?'#e07a8a':'#e0b34a';
      ctx.fillRect(sx+s/2-s*0.18,sy+s*0.15,s*0.36,s*0.3);

    }
    if(b===GRASS2){
      ctx.fillStyle='#4a7d36';
      for(let i=0;i<4;i++){const bx=sx+s*0.2*i+((h2(x,y)>>i)%3);ctx.fillRect(bx,sy+s*0.3+((h2(x,y)>>(i+4))%4),2,s*0.7);}

    }
    // 有贴图的直接贴
    if(TEX[b]){ctx.drawImage(TEX[b][h2(x,y)%3],sx,sy,s+1,s+1);continue;}
  }
  if(digTarget&&digT>0){
    const st=Math.min(3,Math.floor(digT/digNeed*4));
    ctx.drawImage(CRACK[st],ox+digTarget[0]*T*z,oy+digTarget[1]*T*z,T*z,T*z);

  {

  }
  for(const c of crops){

    ctx.fillStyle='#5a9a4c';ctx.fillRect(sx-2.5*z,sy-h*0.6,z*1.5,z);ctx.fillRect(sx+z,sy-h*0.8,z*1.5,z);
    if(c.age>=3){
      ctx.fillStyle='#d9b84b';
      ctx.fillRect(sx-3*z,sy-h-4*z,2*z,4*z);

  const DK=draw.DK||(draw.DK=Array.from({length:24},(_,i)=>`rgba(8,10,22,${(i/23*0.94).toFixed(3)})`));
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){

      ctx.fillRect(sx-bw/2+s,sy-bh/2,bw-2*s,bh);
      ctx.fillRect(sx-bw/2,sy-bh/2+s,bw,bh-2*s);
      // 高光
      ctx.fillStyle='#6a8ae0';
      ctx.fillRect(sx-bw/2+s,sy-bh/2+s*0.9,bw-2*s,bh*0.32);
      // 底部暗
      ctx.fillStyle='#3a4a9e';
      ctx.fillRect(sx-bw/2+s,sy+bh/2-s*2,bw-2*s,s*1.8);
      // 斑点
      ctx.fillStyle='#5a72d0';
      ctx.fillRect(sx-bw/2+bw*0.2,sy-bh*0.05,s*3,s*3);
      ctx.fillRect(sx+bw*0.16,sy+bh*0.12,s*2.4,s*2.4);

      ctx.fillRect(sx+5*s+m.face*3*s,sy-7*s,4.5*s,5*s);
      ctx.fillStyle=m.fury?'#c22222':'#1c1812';
      ctx.fillRect(sx-8.5*s+m.face*3.6*s,sy-5.5*s,2.4*s,2.4*s);
      ctx.fillRect(sx+6.5*s+m.face*3.6*s,sy-5.5*s,2.4*s,2.4*s);
      // 嘴
      ctx.fillStyle='#2e3a80';
      ctx.fillRect(sx-5*s+m.face*3*s,sy+4*s,10*s,1.6*s);
      // 王冠
      ctx.fillStyle='#e8c04b';
      ctx.fillRect(sx-7*s,sy-bh/2-4*s,14*s,3*s);
      ctx.fillRect(sx-7*s,sy-bh/2-7*s,2.4*s,3.5*s);
      ctx.fillRect(sx-1.2*s,sy-bh/2-7.5*s,2.4*s,4*s);
      ctx.fillRect(sx+4.6*s,sy-bh/2-7*s,2.4*s,3.5*s);

      ctx.fillStyle='#00000022';ctx.fillRect(sx-5*s+sway,sy+(F-14)*s,10*s,14*s);
      zz(-4.2,F-6,2.6,6,'#3a4458');zz(1.6,F-6,2.6,6,'#3a4458');
      zz(-4.2,F-1.4,2.6,1.4,'#2a3242');zz(1.6,F-1.4,2.6,1.4,'#2a3242');
      zz(-4.5,F-14,9,8,'#4a6a4e');
      zz(-4.5,F-8,9,1.6,'#3a563e');
      zz(m.face>0?3.4:-7,F-13,3.6,2.2,'#6a9a5a');
      zz(m.face>0?4.2:-8,F-10.6,3.2,2.2,'#6a9a5a');
      zz(-3.6,F-20,7.2,6.6,'#7aa55c');
      if(m.face>0)zz(-3.6,F-20,1.6,6.6,'#63904c');else zz(2,F-20,1.6,6.6,'#63904c');
      ctx.fillStyle='#101a10';
      ctx.fillRect(sx+(m.face>0?0.6:-2.6)*s+sway,sy+(F-18.4)*s,1.8*s,2*s);
      zz(-3.8,F-21.2,7.6,1.8,'#26321e');
      zz(-3.8,F-21.2,2,2.8,'#1e2818');

      ctx.fillRect(sx-bw/2,sy-bh/2+s,bw,bh-2*s);
      ctx.fillStyle='#6ab04c';
      ctx.fillRect(sx-bw/2+s,sy-bh/2+s*0.8,bw-2*s,bh*0.35);

    if(d.kind===STONE)cc='#8a8a92';else if(d.kind==='coal')cc='#2a2a2e';
    else if(d.kind==='iron')cc='#d9a06a';else if(d.kind==='gold')cc='#e8c04b';
    else if(d.kind==='gel')cc='#6ab04c';else if(d.kind==='gem')cc='#b07ae8';else if(d.kind==='seed')cc='#d9b84b';
    else if(d.kind==='coin')cc='#ffd24b';
    else if(d.kind==='star')cc='#fff0a0';
    else if(d.kind===PLANK)cc='#b3945a';else if(d.kind===SAND)cc='#d9c06a';
    else if(d.kind===WOOD)cc='#8a6238';else if(d.kind===TORCH)cc='#ff9a3c';
    ctx.fillStyle='#00000044';ctx.fillRect(sx-s/2+1,sy-s/2+1,s,s);
    ctx.fillStyle=cc;ctx.fillRect(sx-s/2,sy-s/2,s,s);
    ctx.fillStyle='#ffffff55';ctx.fillRect(sx-s/2,sy-s/2,s,1.5);
  }
  {
    const s=z, foot=Math.round(oy+(P.y+P.h/2)*z);
    const pxc=Math.round(ox+P.x*z);
    const fl=P.hurt>0&&(frameN>>2)%2===0;
    // 挖掘/放置时面向鼠标

    let img=PF.idle;

      ctx.fillStyle='#9a9aa2';
      ctx.fillRect(hx+P.face*Math.cos(a)*5*s-2*s,hy+Math.sin(a)*5*s-1.5*s,4*s,3*s);
      ctx.fillStyle='#c9c9d2';
      ctx.fillRect(hx+P.face*Math.cos(a)*5*s-2*s,hy+Math.sin(a)*5*s-1.5*s,4*s,1*s);
    }
  }
  for(const p of parts){
    ctx.globalAlpha=Math.min(1,p.life/20);

    ctx.fillRect(ox+p.x*z,oy+p.y*z,p.sz*z,p.sz*z);
  }
  ctx.globalAlpha=1;
  if(P.hurt>25){ctx.fillStyle=`rgba(200,40,40,${(P.hurt-25)/40*0.3})`;ctx.fillRect(0,0,W,H);}
  const vg=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.42,W/2,H/2,Math.max(W,H)*0.75);
  vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,`rgba(10,8,4,${0.35+0.25*(1-dl)})`);
  ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
}

// 同步测试钩子（不影响正常玩法）
window.__t={
  tick(n,dt){for(let i=0;i<(n||1);i++)update(dt||16);},
  digAt(gx,gy,dt){const z=cam.z;mouse.x=(gx*T+T/2-P.x)*z+W/2;mouse.y=(gy*T+T/2-P.y)*z+H*0.55;mouse.down=1;digStep(dt||1);const r={need:digNeed,block:world[gy][gx]};mouse.down=0;return r;},
  attack(gx,gy){const z=cam.z;mouse.x=(gx*T+T/2-P.x)*z+W/2;mouse.y=(gy*T+T/2-P.y)*z+H*0.55;mouse.down=1;update(16);mouse.down=0;return mobs.length;},
  craft(){toggleCraft();},
  setTier(t,v){toolTier[t]=v;},
  setArmor(v){armorTier=v;P.maxHp=10+ARMOR_HP[v];PF=buildPF(v);hud();},
  setLastHurt(v){lastHurtAt=v;},
  get sel(){return sel;},set sel(v){sel=v;hud();},
};
requestAnimationFrame(loop);
flash('A/D 走，空格跳，左键挖/右键放，E 合成');
</script>
