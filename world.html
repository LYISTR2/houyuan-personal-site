<body class="world" data-world-state="loading" aria-busy="true">
<section id="worldBoot" aria-label="进入河谷"><div class="boot-sprout" aria-hidden="true">❧</div><small>THE BACKYARD VALLEY</small><h1>后院物语</h1><p id="worldBootMessage" role="status">正在铺好河谷的小路…</p><button id="worldRetry" type="button" hidden>重新进入</button><a href="index.html#work">回到主页</a><noscript><p>请启用 JavaScript，再进入河谷。</p></noscript></section>
<canvas id="cv" aria-label="后院河谷大世界：用方向键或 WASD 行走，E 互动，M 地图"></canvas>
<div class="panel" id="hud"><span>DAY <b id="d">1</b></span><span>◈ <b id="c">20</b></span><span>✦ <b id="h">0</b></span></div>
<div class="panel" id="season" role="group" aria-label="画面季节（仅改变外观）"><span class="label">季节 / SEASON</span><button type="button" data-season="spring" aria-pressed="true">春</button><button type="button" data-season="summer" aria-pressed="false">夏</button><button type="button" data-season="autumn" aria-pressed="false">秋</button><button type="button" data-season="winter" aria-pressed="false">冬</button></div>
<div class="panel" id="bar"></div>
<div class="panel" id="tools" role="group" aria-label="田间工具"><button type="button" data-tool="care" aria-pressed="true">种 / 浇 / 收</button><button type="button" data-tool="fertilize" aria-pressed="false">施肥</button><button type="button" data-tool="clear" aria-pressed="false">铲除</button></div><section class="panel" id="ledger" aria-label="仓库与工坊"></section>
<div id="toast"></div>
<div class="panel" id="day"></div>
<button class="panel" id="skip" type="button">⏩ 快进 8 小时</button>
