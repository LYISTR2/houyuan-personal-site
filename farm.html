<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>像素农圃 · 后院</title>
<style>
  :root{--ink:#49341f;--dim:#74573a;--gold:#9e592f;--paper:#f7e8bf;--wood:#775030;--dark:#3c2a1b;--line:#6e482c}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#b6d49f;font-family:system-ui,"PingFang SC","Noto Sans SC",sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none;touch-action:none}
  canvas{position:fixed;inset:0;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
  .panel{position:fixed;background:var(--paper);border:3px solid var(--line);border-radius:2px;padding:10px 14px;box-shadow:inset 0 0 0 2px #fff4d5,5px 5px 0 #3c2a1b88;image-rendering:pixelated}
  #ttl{left:22px;top:20px;background:var(--wood);color:#fff1cf;border-color:var(--dark);font:900 24px ui-monospace,monospace;letter-spacing:.05em;text-shadow:2px 2px var(--dark);padding:14px 20px;box-shadow:inset 0 4px #aa7950,inset 0 -4px #543923,5px 5px 0 #3c2a1b99}
  #ttl::before{content:'✿  BACKYARD / 02';display:block;color:#edcf82;font:700 10px ui-monospace,monospace;letter-spacing:.16em;margin-bottom:5px;text-shadow:none}
  #ttl small{display:block;color:#f0d8ac;font:11px system-ui;margin-top:5px;letter-spacing:0;text-shadow:none}
  #home{left:22px;top:133px;color:#533b25;text-decoration:none;font:700 12px ui-monospace,monospace;padding:8px 12px;transition:transform .18s}
  #home:hover{transform:translateY(-3px)}
  #hud{right:20px;top:20px;display:flex;gap:0;padding:0;font:700 13px ui-monospace,monospace;background:#6f492c;color:#f8e9c2;border-color:var(--dark);box-shadow:inset 0 4px #aa7950,inset 0 -4px #543923,5px 5px 0 #3c2a1b99}
  #hud span{padding:12px 15px;border-right:2px solid #af8756}#hud span:last-child{border:0}#hud b{color:#ffe690}
  #season{right:20px;top:80px;display:flex;gap:5px;align-items:center;padding:7px;background:#eed5a0}
  #season .label{font:800 10px ui-monospace,monospace;margin-right:4px;color:#67472c}
  #season button{border:2px solid #ad8659;background:#fff2cc;color:#67462a;min-width:44px;padding:6px 4px;cursor:pointer;font:800 11px ui-monospace,monospace;transition:transform .16s,background .16s}
  #season button[aria-pressed=true]{background:#81a35d;border-color:#4a6937;color:#172b1c;box-shadow:inset 2px 2px #b8d48c,inset -2px -2px #46673e}
  #season button:hover{transform:translateY(-3px)}
  #bar{left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:6px;padding:9px;background:#865936;border-color:var(--dark);max-width:calc(100vw - 18px);box-shadow:inset 0 4px #b2875a,inset 0 -4px #53381f,5px 5px 0 #3c2a1b88}
  .seed{width:64px;padding:6px 2px;text-align:center;cursor:pointer;border:2px solid #ab865c;border-radius:1px;background:#f5e2b4;color:#503a24;font:700 12px ui-monospace,monospace;transition:transform .16s,background .16s}
  .seed .ic{font-size:21px;line-height:1.2;image-rendering:pixelated}.seed .nm{font-size:11px;margin-top:2px}.seed .pr{font-size:10px;opacity:.75}
  .seed.on{border-color:#46663c;background:#a8c177;box-shadow:inset 2px 2px #d1dd9b,inset -2px -2px #5a8050;color:#24301d}.seed.off{opacity:.65}
  .seed:hover{transform:translateY(-4px);background:#fff0c5}
  #toast{left:50%;bottom:112px;transform:translate(-50%,12px);font:700 12px ui-monospace,monospace;background:#4c6a39;color:#fff5d4;padding:10px 14px;border:3px solid #304d31;opacity:0;transition:opacity .22s,transform .22s;pointer-events:none;position:fixed;z-index:5;white-space:nowrap;box-shadow:4px 4px 0 #3c2a1b88}
  #toast.show{opacity:1;transform:translate(-50%,0)}
  #day{left:22px;bottom:20px;font:800 11px ui-monospace,monospace;color:#63432c}
  #skip{left:22px;bottom:67px;color:var(--ink);font:800 12px ui-monospace,monospace;cursor:pointer;transition:transform .17s,background .17s}
  #skip:hover{transform:translateY(-3px);background:#ffe6a3}
  #hint{right:22px;bottom:20px;font-size:11px;color:#62462c;text-align:right;line-height:1.65}
  #order{right:20px;top:150px;width:232px;font-size:13px;line-height:1.55;background:#f9e5b9}
  #order::before{content:'TODAY’S BASKET  /  今日采收';display:block;font:800 10px ui-monospace,monospace;color:#97613a;letter-spacing:.04em;margin-bottom:5px}
  #order strong{display:block;color:#405f38;font-size:17px;margin-bottom:3px}
  #order-progress{height:10px;background:#d7bf8e;border:2px solid #a37d4b;margin:9px 0 6px;overflow:hidden}
  #order-fill{height:100%;width:0;background:#86a855;transition:width .4s steps(8)}#order small{color:var(--dim);font-size:11px}
  #season button:focus-visible,.seed:focus-visible,#home:focus-visible,#skip:focus-visible{outline:3px solid #fff5dc;outline-offset:3px}
  @media(max-width:680px){#ttl{left:8px;top:8px;padding:8px 10px;font-size:17px}#ttl::before{font-size:8px}#ttl small{font-size:9px}#hud{right:8px;top:8px;font-size:10px}#hud span{padding:9px 5px}#home{left:8px;top:82px;font-size:10px}#season{right:8px;top:102px;padding:4px;gap:3px}#season .label{display:none}#season button{min-width:36px;padding:5px 2px;font-size:10px}#order{top:163px;right:8px;width:171px;font-size:11px;padding:8px}#order::before{font-size:8px}#order strong{font-size:13px}#order small{font-size:9px}#bar{bottom:8px;padding:5px;gap:4px}.seed{width:51px;padding:4px 1px}.seed .ic{font-size:17px}.seed .nm{font-size:10px}.seed .pr{font-size:9px}#skip{left:8px;bottom:100px;font-size:10px;padding:7px}#day{left:8px;bottom:65px;font-size:10px}#hint{display:none}#toast{bottom:92px;font-size:10px}}
  @media(max-height:560px){#order{top:105px}#season{top:60px}#hint,#day{display:none}}
  #workshop{left:22px;top:182px;font:800 12px ui-monospace,monospace;color:#62432d;cursor:pointer}#tools{left:50%;bottom:122px;transform:translateX(-50%);display:flex;gap:5px;padding:6px;white-space:nowrap}#tools button,.farm-btn{background:#fff2ce;border:2px solid #a58055;color:#5a402b;padding:7px 10px;font:700 11px ui-monospace,monospace;cursor:pointer}#tools button[aria-pressed=true]{background:#acbc83;border-color:#58714b}button:disabled{opacity:.48;cursor:default}button:focus-visible{outline:3px solid #fff5dc;outline-offset:3px}#fieldInfo{left:50%;top:18px;transform:translateX(-50%);font:700 11px ui-monospace,monospace;color:#5b4932;max-width:280px;text-align:center;pointer-events:none}#ledger{display:none;z-index:9;left:50%;top:50%;transform:translate(-50%,-50%);width:min(660px,calc(100vw - 24px));max-height:82vh;overflow:auto;touch-action:pan-y;padding:18px}#ledger .ledger-top{display:flex;align-items:center;justify-content:space-between}#ledger h2{font:900 23px serif;margin:0;color:#536143}#ledger h3{font:800 13px ui-monospace,monospace;margin:18px 0 8px;color:#7b4e30}#ledger p{font-size:11px;color:#745b40;line-height:1.7}.ledger-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}#ledger .stock-row,.upgrade-row{padding:9px 0;border-bottom:1px dashed #b4996b;font-size:12px;display:flex;justify-content:space-between;align-items:center;gap:10px}#ledger .stock-row small,.upgrade-row small{display:block;color:#816a4c;font-size:10px;line-height:1.6}.seed.locked{opacity:.5}#bar{max-width:calc(100vw - 18px);overflow-x:auto}.seed{flex-shrink:0}#toast{white-space:normal;text-align:center;max-width:calc(100vw - 20px);bottom:180px}#order::before{content:'NEIGHBOUR’S BASKET / 邻里订单'}#order .farm-btn{margin-top:8px}#skip{bottom:72px}#hint{max-width:190px}#bar .seed .ic{font-size:18px}#focus{font:700 10px ui-monospace,monospace;color:#745b40;margin-top:5px}
  @media(max-width:900px){#fieldInfo{top:auto;bottom:177px;max-width:230px;font-size:10px}#tools{bottom:115px}#workshop{top:180px}#ttl{font-size:20px}#hud span{padding:11px 8px}}
  @media(max-width:680px){#workshop{left:8px;top:128px;font-size:10px;padding:7px}#tools{bottom:132px;padding:4px;gap:3px}#tools button{font-size:10px;padding:7px 8px}#fieldInfo{bottom:178px;padding:5px;font-size:9px;max-width:210px}#order{top:148px;width:156px;padding:7px}#order small{font-size:9px}#order .farm-btn{padding:5px;font-size:9px}#bar{width:calc(100vw - 16px);justify-content:flex-start}.seed{width:calc((100vw - 54px)/6);min-width:44px}#day{bottom:91px;font-size:9px;padding:5px}#skip{bottom:91px;left:auto;right:8px;padding:5px;font-size:9px}#toast{bottom:195px;font-size:10px}#ledger{padding:12px;max-height:85vh}.ledger-grid{grid-template-columns:1fr}#ttl{max-width:175px}#hud{font-size:9px}#hud span{padding:9px 4px}}
  @media(max-height:560px){#order{top:110px;font-size:10px}#workshop{top:156px}#fieldInfo{display:none}#ledger{max-height:90vh}#tools{bottom:108px}#ttl small{display:none}}
  @media(prefers-reduced-motion:reduce){#toast,.seed,#season button,#home,#skip,#order-fill{transition:none}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="panel" id="ttl">像素农圃<small>播种 · 浇水 · 等一场收获</small></div>
<a class="panel" id="home" href="index.html">← 回到后院</a>
<div class="panel" id="hud"><span>DAY <b id="d">1</b></span><span>◈ <b id="c">20</b></span><span>✦ <b id="h">0</b></span></div>
<div class="panel" id="season" role="group" aria-label="画面季节（仅改变外观）"><span class="label">季节 / SEASON</span><button type="button" data-season="spring" aria-pressed="true">春</button><button type="button" data-season="summer" aria-pressed="false">夏</button><button type="button" data-season="autumn" aria-pressed="false">秋</button><button type="button" data-season="winter" aria-pressed="false">冬</button></div>
<div class="panel" id="order" aria-live="polite"><strong id="order-name"></strong><span id="order-text"></span><div id="order-progress"><div id="order-fill"></div></div><small id="order-reward"></small><br><button class="farm-btn" id="deliver" type="button">交付这一篮</button></div>
<div class="panel" id="bar"></div>
<button class="panel" id="workshop" type="button">仓库与工坊 · B</button><div class="panel" id="tools" role="group" aria-label="田间工具"><button type="button" data-tool="care" aria-pressed="true">种 / 浇 / 收</button><button type="button" data-tool="fertilize" aria-pressed="false">施肥</button><button type="button" data-tool="clear" aria-pressed="false">铲除</button></div><div class="panel" id="fieldInfo">点田地照料 · 收获进仓库</div><section class="panel" id="ledger" aria-label="仓库与工坊"></section>
<div id="toast"></div>
<div class="panel" id="day"></div>
<button class="panel" id="skip" type="button">⏩ 快进 8 小时</button>
<div class="panel" id="hint">1–6 选种 · B 仓库与工坊<br>点空地播种 · 点幼苗浇水 · 点成熟作物收获<br>SPACE 快进 8 小时 · 拖动平移 · 滚轮缩放</div>
<script>
"use strict";
/* =====================================================
   像素农圃 —— 逐格绘制的像素农场，零依赖单文件
   ===================================================== */
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
let W,H,DPR;
function rs(){
  DPR=Math.min(devicePixelRatio||1,2);
  W=innerWidth;H=innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;
  cv.style.width=W+'px';cv.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.imageSmoothingEnabled=false;
  cam.z=Math.max(1.2,Math.min(4.5,(W-(W>900?400:24))/(COLS*CELL+116),(H-(H<700?210:240))/(ROWS*CELL+100)));
}
addEventListener('resize',rs);

/* ---------- 调色板 ---------- */
const PAL={
  soilA:'#6b4f35',soilB:'#5d4429',soilWet:'#453421',soilEdge:'#3a2c1c',
  sky0:'#a6d6bf',sky1:'#dae7bb',
  sprout:'#7fae4c',leaf:'#5c8a3c',leafD:'#44682e',
  wheat:'#d9b84b',wheatD:'#b3923a',
  tomato:'#c94f4f',tomatoD:'#9c3838',
  pump:'#d98a3c',pumpD:'#a8662a',
  herb:'#6aa87f',herbD:'#4e8160',
  dead:'#6a5a44',
  fence:'#4a3a28',fenceL:'#5d4a34',
  star:'#e8e0cf',
};

/* ---------- 像素精灵（位图，1=有色 0=透明） ---------- */
// 每个生长阶段一张小图，8x8 ~ 12x12，运行时放大
const SPR={
  sprout:[ // 发芽
    "00011000",
    "00111100",
    "00011000",
    "00011000",
  ],
  leaf:[ // 苗
    "00111100",
    "01111110",
    "11100111",
    "00111100",
    "00011000",
    "00011000",
  ],
  bush:[ // 成株
    "01100110",
    "11111111",
    "11111111",
    "01111110",
    "00111100",
    "00011000",
  ],
};
function fruitDots(kind){ // 果实位置随品种错开
  return kind==='tomato'?[[-4,-10],[3,-12],[0,-18]]:kind==='pump'?[[0,-5]]:[[-5,-13],[5,-16],[0,-21]];
}

/* ---------- 游戏数据 ---------- */
const COLS=7,ROWS=5;
const SEEDS=[
  {id:'wheat', nm:'麦子', ic:'🌾', price:4,  sell:9,  c:PAL.wheat, cd:PAL.wheatD, h:2},
  {id:'tomato',nm:'番茄', ic:'🍅', price:6,  sell:15, c:PAL.tomato,cd:PAL.tomatoD,h:3},
  {id:'pump',  nm:'南瓜', ic:'🎃', price:10, sell:26, c:PAL.pump,  cd:PAL.pumpD,  h:4},
  {id:'herb',  nm:'薄荷', ic:'🌿', price:3,  sell:7,  c:PAL.herb,  cd:PAL.herbD,  h:2},
  {id:'berry', nm:'草莓', ic:'🍓', price:8, sell:22, c:'#db6b76',cd:'#9d4256',h:3,unlock:15,grow:10},
  {id:'sun', nm:'向日葵', ic:'🌻', price:12,sell:32,c:'#edce6d',cd:'#9e7536',h:4,unlock:30,grow:12},
];
const GROW=8; // 每阶段浇水小时
let plots=[],coins=20,day=1,hour=8,harv=0,sel=0;
let cam={x:0,y:0,z:3},drag=null,moved=0;   // z = 像素放大倍数
const KEY='pixelfarm-v1';
// 仅视觉偏好另存，不触碰旧种植存档。
const SEASON_KEY='pixelfarm-season-v1',SEASONS=['spring','summer','autumn','winter'];
let season='spring',reducedMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
try{const stored=localStorage.getItem(SEASON_KEY);if(SEASONS.includes(stored))season=stored;}catch(e){}
const motionPreference=matchMedia('(prefers-reduced-motion: reduce)');
motionPreference.addEventListener('change',e=>{reducedMotion=e.matches;particles.length=0;});
function setSeason(value){
  if(!SEASONS.includes(value))return;
  season=value;
  document.querySelectorAll('#season button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.season===value)));
  try{localStorage.setItem(SEASON_KEY,value);}catch(e){}
}
let store={},compost=0,honey=0,deliveries=0,tool='care',hoverPlot=null,ledgerOpen=false,ledgerStamp='';
let upgrades={can:0,sprinkler:0,hive:0},badges=[];
const BADGES=[{id:'first',name:'第一季收成',text:'收获 10 次',ready:()=>harv>=10,reward:25},{id:'variety',name:'一篮四色',text:'四种基础作物各收获 5 次',ready:()=>SEEDS.slice(0,4).every(s=>(counts[s.id]||0)>=5),reward:60},{id:'neighbour',name:'邻里常客',text:'交付 5 篮订单',ready:()=>deliveries>=5,reward:75},{id:'gardener',name:'坡上的园丁',text:'累计收获 60 次',ready:()=>harv>=60,reward:120}];
let order={id:'wheat',goal:3,done:0,number:1},counts={};
const availableSeeds=()=>SEEDS.filter(s=>harv>=(s.unlock||0));
const marketSeed=()=>{const crops=availableSeeds();return crops[(day-1)%crops.length]};
function nextOrder(n){const crops=availableSeeds();return {id:crops[(n-1)%crops.length].id,goal:Math.min(12,3+Math.floor((n-1)/4)),done:0,number:n};}
const limit=(value,max=999999)=>Number.isFinite(value)?Math.max(0,Math.min(max,Math.floor(value))):0;
function init(){plots=[];for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)plots.push({x,y,s:null,st:0,w:0,p:0,dead:0,dry:0,fert:0,care:0});}
init();
function save(){try{localStorage.setItem(KEY,JSON.stringify({v:2,plots,coins,day,hour,harv,order,counts,store,compost,honey,deliveries,upgrades,badges}));}catch(e){flash('存储不可用，请检查浏览器设置');}}
(function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.plots)&&d.plots.length===COLS*ROWS){
  plots=plots.map((p,i)=>{const q=d.plots[i];if(!q||q.x!==p.x||q.y!==p.y)return p;return {...p,s:SEEDS.some(S=>S.id===q.s)?q.s:null,st:limit(q.st,3),w:limit(q.w,64),p:Math.max(0,Math.min(24,Number(q.p)||0)),dead:q.dead?1:0,dry:limit(q.dry),fert:limit(q.fert,1),care:limit(q.care,10000)};});
  if(Number.isFinite(d.coins))coins=limit(d.coins);if(Number.isFinite(d.day))day=Math.max(1,limit(d.day));
  if(Number.isFinite(d.hour))hour=limit(d.hour,23);if(Number.isFinite(d.harv))harv=limit(d.harv);
  if(d.order&&SEEDS.some(S=>S.id===d.order.id)&&Number.isFinite(d.order.goal)&&Number.isFinite(d.order.done)&&Number.isFinite(d.order.number))order={id:d.order.id,goal:Math.max(1,limit(d.order.goal,99)),done:limit(d.order.done,99),number:Math.max(1,limit(d.order.number))};
  for(const S of SEEDS){counts[S.id]=limit(d.counts?.[S.id]);const row=d.store?.[S.id];store[S.id]=[0,1,2].map(i=>limit(row?.[i]));}
  compost=limit(d.compost);honey=limit(d.honey);deliveries=limit(d.deliveries);if(d.upgrades)for(const k of Object.keys(upgrades))upgrades[k]=limit(d.upgrades[k],k==='can'?2:1);
  badges=Array.isArray(d.badges)?d.badges.filter(id=>BADGES.some(b=>b.id===id)):[];
}}catch(e){}})();

/* ---------- 网格 ---------- */
const CELL=16; // 一格 16 像素（放大 z 倍）
function toScreen(gx,gy){
  return [W/2-(W>900?100:0)+(gx-(COLS-1)/2)*CELL*cam.z+cam.x, H/2+(gy-(ROWS-1)/2)*CELL*cam.z+cam.y];
}
function toGrid(mx,my){
  const gx=(mx-W/2+(W>900?100:0)-cam.x)/(CELL*cam.z)+(COLS-1)/2;
  const gy=(my-H/2-cam.y)/(CELL*cam.z)+(ROWS-1)/2;
  return [Math.floor(gx+.5),Math.floor(gy+.5)];
}

/* ---------- 绘制 ---------- */
function px(x,y,w,h,c){
  if(c===undefined){c=h;h=w;}
  ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.ceil(w),Math.ceil(h));
}
function drawSprite(map,cx,cy,c1,c2){
  const s=cam.z;
  for(let r=0;r<map.length;r++)for(let i=0;i<map[r].length;i++){
    if(map[r][i]==='1'){
      px(cx+(i-map[r].length/2)*s, cy+(r-map.length)*s, s, (r<map.length/2)?c2:c1);
    }
  }
}
function drawPlot(p){
  const z=cam.z, s=CELL*z;
  const [cx,cy]=toScreen(p.x,p.y);
  const x=cx-s/2, y=cy-s/2;
  const sway=(!reducedMotion&&p.s&&p.st>0)?Math.sin(sceneTime*.002+p.x*1.7+p.y*.9)*z*.55:0;
  const stemX=cx+sway;
  // 土壤棋盘
  const wet=p.w>0;
  px(x,y,s,(p.x+p.y)%2?(wet?PAL.soilWet:PAL.soilB):(wet?PAL.soilWet:PAL.soilA));
  // 边缘
  px(x,y,s,z,PAL.soilEdge);px(x,y+s-z,s,z,PAL.soilEdge);
  px(x,y,z,s,PAL.soilEdge);px(x+s-z,y,z,s,PAL.soilEdge);
  // 耕沟、湿土反光与堆肥颗粒
  for(let row=0;row<3;row++){px(x+2*z,y+(4+row*4)*z,12*z,z,wet?'#302b25':'#493523');px(x+2*z,y+(3+row*4)*z,11*z,z,wet?'#655d43':'#8a6843')}
  if(wet){px(x+2*z,y+2*z,3*z,z,'#9a9a70');px(x+11*z,y+11*z,2*z,z,'#a5aa83')}
  if(p.fert)for(let i=0;i<4;i++)px(x+(3+i*3)*z,y+(2+(i*5)%12)*z,z,z,'#d5b47a');

  if(p.w>0){p.w--;if(p.st<3){p.care++;p.p+=1+(p.fert?.25:0)+(upgrades.hive&&p.st>=2?.15:0)}}
  if(p.p>=grow&&p.st<3){p.st++;p.p-=grow;burst(p.x,p.y,['#e5f1ae','#c0d977','#fff2c8'],7)}
  if(p.w<=0&&p.st<3)p.dry++;else p.dry=0;
 }
 save();hud();
}
setInterval(()=>{if(!document.hidden)tick()},1500);
function act(p){
 if(ledgerOpen)return;
 if(tool==='clear'){if(!p.s){flash('这格已经是空地');return}if(!p.dead&&!confirm('铲除这格作物？种子不会退回。'))return;Object.assign(p,{dead:0,s:null,st:0,p:0,fert:0,care:0});flash('清理了田地')}
 else if(tool==='fertilize'){if(!p.s||p.dead||p.st>=3){flash('堆肥只用于未成熟作物');return}if(p.fert){flash('这株已经施肥');return}if(!compost){flash('没有堆肥 · 可在工坊用薄荷制作');return}compost--;p.fert=1;burst(p.x,p.y,['#cbb580','#a7bd72'],8);flash('施肥完成 · 加速生长，金星收成')}
 else if(p.dead){Object.assign(p,{dead:0,s:null,st:0,p:0,fert:0,care:0});flash('清理了枯株')}
 else if(!p.s){const S=SEEDS[sel];if(harv<(S.unlock||0)){flash('累计收获 '+S.unlock+' 次后解锁');return}if(coins<S.price){flash('零钱不足 · 去仓库出售收成');return}coins-=S.price;Object.assign(p,{s:S.id,st:0,p:0,w:32,dry:0,fert:0,care:0});burst(p.x,p.y,['#e9d6a0','#7db565','#fff0c3'],8);flash('种下 '+S.nm)}
 else if(p.st>=3){const S=SEEDS.find(s=>s.id===p.s),q=p.fert?2:p.w>0&&p.care>=(S.grow||GROW)*2.4?1:0;store[S.id]||=[0,0,0];store[S.id][q]++;harv++;counts[S.id]=(counts[S.id]||0)+1;burst(p.x,p.y,[S.c,'#ffe596','#fff8d5'],16);Object.assign(p,{s:null,st:0,p:0,fert:0,care:0});flash(quality[q]+' '+S.nm+' 收进仓库 · B 出售或交订单');try{parent.postMessage({type:'farm-harvest',value:cropPrice(S,q),total:harv},'*')}catch(e){}}
 else{const targets=upgrades.can?plots.filter(q=>q.s&&!q.dead&&Math.abs(q.x-p.x)<=1&&Math.abs(q.y-p.y)<=1&&(upgrades.can===2||Math.abs(q.x-p.x)+Math.abs(q.y-p.y)<=1)):[p];for(const q of targets){q.w=Math.min(q.w+24,32+upgrades.can*16);burst(q.x,q.y,['#a1d5df','#e3f4ed'],5)}flash('浇透了 '+targets.length+' 格')}
 save();hud();
}

/* ---------- 输入 ---------- */
cv.addEventListener('pointerdown',e=>{if(ledgerOpen)return;cv.setPointerCapture(e.pointerId);drag={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y};moved=0;});
cv.addEventListener('pointermove',e=>{
  const [gx,gy]=toGrid(e.clientX,e.clientY);hoverPlot=plots.find(p=>p.x===gx&&p.y===gy)||null;fieldInfo();
  if(!drag)return;
  const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
  if(!moved&&Math.abs(dx)+Math.abs(dy)<=5)return;moved=1;
  cam.x=drag.cx+dx;cam.y=drag.cy+dy;
});
cv.addEventListener('pointerup',e=>{
  if(!drag)return;drag=null;if(moved||ledgerOpen)return;
  const [gx,gy]=toGrid(e.clientX,e.clientY);
  const p=plots.find(q=>q.x===gx&&q.y===gy);hoverPlot=p||null;
  if(p)act(p);
});
cv.addEventListener('pointercancel',()=>drag=null);cv.addEventListener('pointerleave',()=>{hoverPlot=null;fieldInfo()});
cv.addEventListener('wheel',e=>{
  e.preventDefault();
  cam.z=Math.min(7,Math.max(1.5,cam.z*(e.deltaY>0?0.9:1.12)));
},{passive:false});
addEventListener('keydown',e=>{
  if(e.repeat)return;
  if(e.key.toLowerCase()==='b'){toggleLedger();return}if(e.key==='Escape'&&ledgerOpen){toggleLedger();return}if(ledgerOpen)return;
  if(e.key>='1'&&e.key<='6'){const i=+e.key-1;if(harv>=(SEEDS[i].unlock||0)){sel=i;tool='care';hud()}}
  if(e.key===' '){e.preventDefault();for(let i=0;i<8;i++)tick()}
});
document.getElementById('workshop').onclick=toggleLedger;document.getElementById('deliver').onclick=deliver;
document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;hud()});
document.getElementById('skip').onclick=()=>{for(let i=0;i<8;i++)tick();};
document.querySelectorAll('#season button').forEach(button=>button.onclick=()=>setSeason(button.dataset.season));
setSeason(season);

/* ---------- HUD ---------- */
const bar=document.getElementById('bar');
SEEDS.forEach((S,i)=>{
  const d=document.createElement('button');d.type='button';d.className='seed';
  d.innerHTML=`<div class="ic">${S.ic}</div><div class="nm">${S.nm}</div><div class="pr">${S.price}◈</div>`;
  d.onclick=()=>{if(harv<(S.unlock||0)){flash('收获 '+S.unlock+' 次解锁 '+S.nm);return}sel=i;tool='care';hud();};
  bar.appendChild(d);
});
function fieldInfo(){const p=hoverPlot;if(!p){document.getElementById('fieldInfo').textContent=tool==='fertilize'?'堆肥 '+compost+' · 点未成熟作物施肥':tool==='clear'?'铲除模式 · 种子不退回':'收获进仓库 · B 出售与升级';return}const S=SEEDS.find(s=>s.id===p.s);document.getElementById('fieldInfo').textContent=S?S.nm+' · '+(p.st===3?'可收获':Math.min(99,Math.floor((p.st+p.p/(S.grow||GROW))/3*100))+'%')+' · 水分 '+p.w+(p.fert?' · 已施肥':''):('空地 · 种下 '+SEEDS[sel].nm)}
function hud(){
  document.getElementById('d').textContent=day;
  document.getElementById('c').textContent=coins;
  document.getElementById('h').textContent=harv;
  document.getElementById('day').textContent=String(hour).padStart(2,'0')+':00'+(day%5===0?' · 雨天，田地会自然回潮':' · 晴天');
  const O=SEEDS.find(S=>S.id===order.id);
  const need=Math.max(0,order.goal-order.done),held=totalStock(O.id);
  document.getElementById('order-name').textContent='第 '+order.number+' 篮 · '+O.nm;
  document.getElementById('order-text').textContent='仓库 '+held+' / '+need+' 份'+(order.done?' · 旧进度已保留':'');
  document.getElementById('order-fill').style.width=Math.min(100,(held+order.done)/order.goal*100)+'%';
  document.getElementById('order-reward').textContent='货款 + 奖金 '+order.goal*6+'◈ · 堆肥 ×2';
  document.getElementById('deliver').disabled=held<need;
  [...bar.children].forEach((d,i)=>{
    const locked=harv<(SEEDS[i].unlock||0);
    d.classList.toggle('on',i===sel&&tool==='care');d.classList.toggle('locked',locked);
    d.classList.toggle('off',coins<SEEDS[i].price);
    d.querySelector('.pr').textContent=locked?'收获 '+SEEDS[i].unlock:SEEDS[i].price+'◈';
    d.setAttribute('aria-pressed',String(i===sel&&tool==='care'));
  });
  document.querySelectorAll('[data-tool]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.tool===tool)));
  fieldInfo();if(ledgerOpen)ledger();
}
let tt;
function flash(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1400);}

// 旧存档若把全部零钱用尽且田里无作物，补一包便宜的种子防止死局。
if(coins<3&&!plots.some(p=>p.s&&!p.dead)&&!SEEDS.some(s=>totalStock(s.id))&&!honey){coins=4;flash('找到一包麦种 · 补给 4◈');save();}
rs();hud();
(function loop(now){
  if(document.hidden){lastFrame=0;requestAnimationFrame(loop);return;}
  const delta=lastFrame?Math.min((now-lastFrame)/16.67,2):1;
  lastFrame=now;
  if(!reducedMotion)sceneTime+=Math.min(delta*16.67,34);
  draw(reducedMotion?0:delta);
  requestAnimationFrame(loop);
})(0);
</script>
</body>
</html>
